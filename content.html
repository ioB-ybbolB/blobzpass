<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connecting · blobzpass</title><style>html{color-scheme:dark;background:#141821;color:#dbe2f4;font:14px system-ui}main{max-width:560px;margin:15vh auto;text-align:center}h1{font-size:22px}p{color:#adb6c8}</style></head><body><main><h1>Connecting to blobzpass</h1><p id="status">Preparing the content Service Worker…</p></main><script>
'use strict';
function b64url(data){const bytes=new TextEncoder().encode(data);let binary='';for(let i=0;i<bytes.length;i+=12000)binary+=btoa(String.fromCharCode(...bytes.subarray(i,i+12000)));return binary.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
(async()=>{try{
  if(!('serviceWorker' in navigator))throw Error('This browser does not support Service Workers');
  const raw=new URLSearchParams(location.search).get('url');
  const target=new URL(raw);
  if(!['https:','http:'].includes(target.protocol))throw Error('Only HTTP(S) websites are supported');
  const appBase=new URL('./',location.href).pathname; // /blobzpass/ on GitHub Pages
  const reg=await navigator.serviceWorker.register(appBase+'sw.js',{scope:appBase});
  await navigator.serviceWorker.ready;
  if(!navigator.serviceWorker.controller){
    await new Promise((resolve,reject)=>{
      const timeout=setTimeout(()=>reject(Error('Service Worker activation timed out')),10000);
      navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(timeout);resolve();},{once:true});
    });
  }
  location.replace(appBase+'__bp__/o/'+b64url(target.origin)+target.pathname+target.search+target.hash);
}catch(error){document.getElementById('status').textContent='Unable to start: '+error.message;console.error(error);}})();
</script></body></html>
