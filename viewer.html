<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>blobzpass v2.1 — Browser</title>
<style>
:root{color-scheme:dark;--top:#111318;--tab:#1b1e25;--active:#292e38;--bar:#373d49;--blue:#80acfb;--fg:#edf1f8}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#15171d;color:var(--fg);font:13px/1.5 system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column}
button,input{font:inherit}button{color:inherit;cursor:pointer}button:disabled{opacity:.3;cursor:default}
.tabstrip{height:46px;min-height:46px;display:flex;align-items:end;gap:5px;background:var(--top);padding:7px 10px 0}.brand{color:var(--blue);font-size:20px;font-weight:900;margin:0 10px 5px 3px}
#tabs{display:flex;align-items:end;gap:5px;max-width:calc(100vw - 125px);min-width:0;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#424a5a transparent}
.tab{height:34px;min-width:105px;width:210px;max-width:230px;flex:0 1 210px;border:1px solid transparent;border-bottom:0;border-radius:12px 12px 0 0;background:#1c2029;display:flex;align-items:center;gap:8px;padding:0 7px 0 12px;transition:background .18s,height .18s;text-align:left;white-space:nowrap}
.tab:hover{background:#232937}.tab.active{height:38px;background:var(--active);border-color:#3b424e}.tab-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.tab-icon{width:17px;height:17px;object-fit:contain;border-radius:3px;flex:none}.tab-fallback{width:17px;height:17px;flex:none;border-radius:5px;display:grid;place-items:center;background:#45536a;color:#dce6f8;font-size:10px;font-weight:700}
.tab-close{border:0;background:none;border-radius:6px;color:#a8b3c3;font-size:17px;width:21px;height:21px;padding:0;display:grid;place-items:center}.tab-close:hover{background:#454c58;color:white}
#new-tab{width:31px;height:31px;border:0;background:transparent;border-radius:9px;font-size:24px;line-height:1;align-self:center}#new-tab:hover{background:#323944}
.tab.loading .tab-fallback{font-size:0;position:relative}.tab.loading .tab-fallback:after{content:"";inset:2px;position:absolute;border:2px solid #6d88b2;border-top-color:white;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.toolbar{height:59px;min-height:59px;background:var(--active);box-shadow:0 3px 15px #0005;z-index:3;display:flex;align-items:center;gap:8px;padding:7px 13px}
.navgroup{display:flex;align-items:center;gap:3px}.nav{border:0;border-radius:50%;width:34px;height:34px;background:transparent;display:grid;place-items:center;transition:background .16s,transform .15s}.nav:hover:not(:disabled){background:#434b5b}.nav:active:not(:disabled){transform:scale(.9)}.nav svg{width:19px;height:19px;fill:none;stroke:#d8dfeb;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}
#form{height:39px;border:1px solid #4b5360;border-radius:23px;background:var(--bar);display:flex;align-items:center;gap:9px;padding:0 13px;flex:1;min-width:0;transition:box-shadow .18s,background .18s}#form:focus-within{box-shadow:0 0 0 2px #729def55;background:#414959}#address{width:100%;border:0;outline:0;color:#f2f4f9;background:transparent;font-size:14px}#address::placeholder{color:#a9b2c2}#go{display:none}
#security{color:#b6c8e4;font-size:15px}#progress{height:2px;min-height:2px;overflow:hidden}#progress.loading:after{content:"";position:relative;display:block;height:2px;width:38%;background:linear-gradient(90deg,transparent,#83adff,transparent);animation:slide 1.2s infinite}@keyframes slide{from{left:-40%}to{left:110%}}
#panel{flex:1;min-height:0;position:relative;background:white}/* Keep inactive tab documents laid out: display:none destroys canvas/WebGL sizes. */
#panel > iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:white;opacity:0;pointer-events:none;z-index:0}
#panel > iframe.active{opacity:1;pointer-events:auto;z-index:1}
#status{position:absolute;bottom:14px;left:13px;z-index:6;background:#233044ee;border:1px solid #4b5770;color:#d2dcec;border-radius:10px;padding:7px 12px;box-shadow:0 5px 20px #0006;max-width:70vw;opacity:0;pointer-events:none;transform:translateY(7px);transition:opacity .2s,transform .2s}#status.visible{opacity:1;transform:translateY(0)}#status.error{color:#ffcfca;background:#452d32;border-color:#855057}
#captchaNotice{position:absolute;z-index:8;top:12px;left:50%;transform:translateX(-50%);max-width:760px;width:calc(100vw - 32px);padding:10px 14px;background:#382f25;color:#f6d8a9;border:1px solid #8b6f40;border-radius:10px;box-shadow:0 8px 25px #0008}#captchaNotice[hidden],#menu[hidden]{display:none}#captchaNotice a{color:#fbd297}
#menu{position:absolute;z-index:10;right:12px;top:105px;padding:9px;background:#252c39;border:1px solid #475265;border-radius:11px;box-shadow:0 12px 25px #0009;min-width:190px}#menu button{display:block;width:100%;padding:9px;text-align:left;background:none;border:0;border-radius:7px}#menu button:hover{background:#455067}#menu small{color:#b7c1d1;margin:6px;display:block}
@media(max-width:650px){.brand{display:none}.tab{width:140px;min-width:95px;flex-basis:140px}.toolbar{gap:3px;padding:6px}.navgroup{gap:0}.nav{width:29px}.nav svg{width:16px}#form{gap:5px;padding:0 9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}}
  
/* v2.1: restore v1.7's original browser chrome, without rendering regressions. */
.tabstrip{box-shadow:inset 0 -1px 0 #39414d}.tab.active{background:linear-gradient(#303744,#292e38)}.nav:focus-visible,.tab:focus-visible,#new-tab:focus-visible{outline:2px solid #93b6fd;outline-offset:1px}
#panel>iframe{will-change:opacity;transition:opacity .14s ease}#panel>iframe.active{opacity:1}
#danger{position:absolute;right:15px;bottom:15px;background:#252d3bdd;color:#dde3ed;padding:4px 9px;border:1px solid #505d76;border-radius:8px;font-size:11px;pointer-events:none;z-index:4}
#danger[hidden]{display:none}
</style></head><body>
<div class="tabstrip"><div class="brand" title="blobzpass">b.</div><div id="tabs" role="tablist" aria-label="Browser tabs"></div><button id="new-tab" title="New tab (Ctrl+T)" aria-label="New tab">+</button></div>
<div class="toolbar"><div class="navgroup">
<button id="back" class="nav" title="Back (Alt+Left)" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7M8 12h12"/></svg></button>
<button id="forward" class="nav" title="Forward (Alt+Right)" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7M16 12H4"/></svg></button>
<button id="reload" class="nav" title="Reload (Ctrl+R)" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 1 6M20 3v5h-5"/></svg></button>
<button id="home" class="nav" title="Home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="m3 11 9-7 9 7M5 10v10h14V10M10 20v-6h4v6"/></svg></button></div>
<form id="form"><span id="security" title="Virtual website address, tunneled through Noteboard">◇</span><input id="address" type="text" inputmode="url" placeholder="Enter a website URL" aria-label="Website URL" autocomplete="off" spellcheck="false"><button id="go" type="submit">Go</button></form>
<button id="more" class="nav" title="Options" aria-label="Options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></div>
<div id="progress"></div><div id="panel"><div id="status" role="status" aria-live="polite"></div><div id="danger" hidden>Shared-origin preview • untrusted pages can access the toolbar</div></div>
<div id="menu" hidden><small>blobzpass browser</small><button id="copy-url">Copy page URL</button><button id="open-original">Open original site</button><button id="menu-tab">New tab</button></div>
<script>(() => {
  'use strict';
  const HOME='https://blobby-boi2.github.io/BlobbypassPlus/';
  const ORIGIN=location.origin;
  const APP_BASE=new URL('./',location.href).pathname; // /blobzpass/ on GitHub Pages
  const FRAME_BOOTSTRAP=APP_BASE+'content.html';
  const PROXY_PREFIX=APP_BASE+'__bp__/o/';
  const tabs=[];
  const tabsBar=document.getElementById('tabs');
  const panel=document.getElementById('panel');
  const addr=document.getElementById('address');
  const progress=document.getElementById('progress');
  const menu=document.getElementById('menu');
  const status=document.getElementById('status');
  let active=null, sequence=0, toastTimer;
  function notify(message,error=false) {
    status.textContent=String(message);
    status.classList.toggle('error',!!error);
    status.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>status.classList.remove('visible'),4500);
  }
  function normalize(raw) {
    let value=String(raw||'').trim();
    if(!value)return null;
    if(!/^[a-z][\w+.-]*:\/\//i.test(value)) value='https://'+value;
    const u=new URL(value);
    if(!['http:','https:'].includes(u.protocol))throw new Error('Only HTTP and HTTPS URLs are supported');
    return u.href;
  }
  function update() {
    for(const tab of tabs) {
      const selected=tab===active;
      tab.button.classList.toggle('active',selected);
      tab.button.classList.toggle('loading',tab.loading);
      tab.button.setAttribute('aria-selected',String(selected));
      tab.frame.classList.toggle('active',selected);
      tab.titleEl.textContent=tab.title||'New tab';
      if(tab.icon) {
        if(tab.favicon.src!==tab.icon)tab.favicon.src=tab.icon;
        tab.favicon.hidden=false;tab.fallback.hidden=true;
      } else {tab.favicon.hidden=true;tab.fallback.hidden=false;}
    }
    addr.value=active?.blankHome?'':(active?.url||'');
    progress.classList.toggle('loading',!!active?.loading);
  }
  function send(tab,action,url) {
    if(!tab)return;
    tab.loading=true;
    const message={type:'blobzpass:command',action,url};
    tab.frame.contentWindow?.postMessage(message,ORIGIN);
    update();
  }
  function go(tab,raw) {
    const url=normalize(raw);if(!url)return;
    tab.blankHome=false;
    tab.url=url;tab.title='Loading…';tab.icon='';tab.loading=true;
    if(tab.ready)send(tab,'navigate',url);
    else tab.frame.src=FRAME_BOOTSTRAP+'?url='+encodeURIComponent(url);
    update();
  }
  function newTab(url=HOME,blankHome=true) {
    const tab={id:++sequence, url, title:'New tab',icon:'',ready:false,loading:true,blankHome};
    const button=document.createElement('div');button.className='tab';button.setAttribute('role','tab');button.tabIndex=0;
    const fallback=document.createElement('span');fallback.className='tab-fallback';fallback.textContent='◈';
    const icon=document.createElement('img');icon.className='tab-icon';icon.alt='';icon.hidden=true;
    const label=document.createElement('span');label.className='tab-label';
    const close=document.createElement('button');close.type='button';close.className='tab-close';close.textContent='×';close.title='Close tab';close.setAttribute('aria-label','Close tab');
    button.append(fallback,icon,label,close);
    const frame=document.createElement('iframe');frame.title='Proxied website';frame.referrerPolicy='no-referrer';
    // This permits native-origin browser APIs. On the SAME origin it does not
    // isolate hostile page scripts from the toolbar. See README.
    frame.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin allow-popups allow-downloads');
    tab.button=button;tab.titleEl=label;tab.favicon=icon;tab.fallback=fallback;tab.frame=frame;
    button.addEventListener('click',()=>{active=tab;update();});
    button.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();active=tab;update();}});
    close.addEventListener('click',e=>{e.stopPropagation();closeTab(tab);});
    frame.addEventListener('error',()=>notify('Could not load this page. Check the Service Worker and Noteboard gateway.',true));
    tabsBar.append(button);panel.append(frame);tabs.push(tab);active=tab;
    frame.src=FRAME_BOOTSTRAP+'?url='+encodeURIComponent(url);
    update();return tab;
  }
  function closeTab(tab) {
    const index=tabs.indexOf(tab);if(index===-1)return;
    tab.button.remove();tab.frame.remove();tabs.splice(index,1);
    if(active===tab)active=tabs[Math.min(index,tabs.length-1)]||null;
    if(!tabs.length)newTab();else update();
  }
  window.addEventListener('message',event=>{
    if(event.origin!==ORIGIN || event.data?.type!=='blobzpass:state')return;
    const tab=tabs.find(x=>x.frame.contentWindow===event.source);
    if(!tab)return;
    let next;
    try {next=normalize(event.data.url);}catch{return;}
    tab.ready=true;tab.loading=false;tab.url=next;
    tab.title=String(event.data.title||new URL(next).hostname).slice(0,160);
    const icon=event.data.icon;
    // Preserve the proxy route. Never fetch the remote favicon directly.
    tab.icon=typeof icon==='string' && icon.startsWith(PROXY_PREFIX)?ORIGIN+icon:'';
    if(next!==HOME)tab.blankHome=false;
    update();
  });
  document.getElementById('form').addEventListener('submit',e=>{
    e.preventDefault();if(!active)return;
    try{go(active,addr.value)}catch(error){notify(error.message,true)}
  });
  document.getElementById('new-tab').onclick=()=>newTab();
  document.getElementById('back').onclick=()=>send(active,'back');
  document.getElementById('forward').onclick=()=>send(active,'forward');
  document.getElementById('reload').onclick=()=>send(active,'reload');
  document.getElementById('home').onclick=()=>go(active,HOME);
  document.getElementById('more').onclick=e=>{e.stopPropagation();menu.hidden=!menu.hidden};
  document.addEventListener('click',e=>{if(!menu.contains(e.target) && e.target.id!=='more' && !e.target.closest('#more'))menu.hidden=true});
  document.getElementById('copy-url').onclick=()=>{menu.hidden=true;const url=active?.url;if(!url)return; navigator.clipboard?.writeText(url).then(()=>notify('Copied page URL'),()=>notify('Clipboard unavailable',true))};
  document.getElementById('open-original').onclick=()=>{menu.hidden=true;if(active?.url)window.open(active.url,'_blank','noopener,noreferrer')};
  document.getElementById('menu-tab').onclick=()=>{menu.hidden=true;newTab()};
  document.addEventListener('keydown',e=>{
    const key=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey)&&key==='t'){e.preventDefault();newTab()}
    else if((e.ctrlKey||e.metaKey)&&key==='w'){e.preventDefault();closeTab(active)}
    else if((e.ctrlKey||e.metaKey)&&key==='l'){e.preventDefault();addr.focus();addr.select()}
    else if((e.ctrlKey||e.metaKey)&&key==='r'){e.preventDefault();send(active,'reload')}
    else if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();send(active,'back')}
    else if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();send(active,'forward')}
    else if(e.key==='Escape')menu.hidden=true;
  });
  // UI and proxied documents are intentionally on one real origin.
  // Hide this note by appending ?hideSharedOriginWarning=1 if understood.
  document.getElementById('danger').hidden = new URLSearchParams(location.search).has('hideSharedOriginWarning');
  newTab();
})();
</script>
</body></html>
